services:
  - type: web
    name: mandate
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MANDATE_AGENT_TOKEN
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DATA_FILE
        value: /tmp/mandate-state.json
